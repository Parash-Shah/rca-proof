name: rcaproof
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rcaproof
      POSTGRES_USER: rcaproof
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:${RCAPROOF_DB_PORT:-5433}:5432"
    volumes:
      - incident-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcaproof -d rcaproof"]
      interval: 5s
      timeout: 5s
      retries: 20
  rcaproof-api:
    build:
      context: .
      args:
        SERVICE: rcaproof-api
        MODULE_PATH: rcaproof-api
    ports:
      - "127.0.0.1:${RCAPROOF_API_PORT:-8084}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/rcaproof?socketTimeout=10
      LAB_AWS_ENDPOINT: http://localstack:4566
      LAB_HTTP_ENDPOINT: http://wiremock:8080
      RCAPROOF_CI_PUBLIC_KEY: ${RCAPROOF_CI_PUBLIC_KEY:-}
      RCAPROOF_GITHUB_TOKEN: ${RCAPROOF_GITHUB_TOKEN:-}
      RCAPROOF_GITHUB_REPOSITORY: ${RCAPROOF_GITHUB_REPOSITORY:-Parash-Shah/rca-proof}
      RCAPROOF_GITHUB_BASE_BRANCH: ${RCAPROOF_GITHUB_BASE_BRANCH:-main}
      RCAPROOF_REVIEW_KEY: ${RCAPROOF_REVIEW_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      wiremock:
        condition: service_healthy
  wiremock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "127.0.0.1:${RCAPROOF_HTTP_LAB_PORT:-8085}:8080"
    command: ["--disable-banner", "--max-request-journal-entries", "10000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/mappings > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  localstack:
    image: localstack/localstack:4.7.0
    ports:
      - "127.0.0.1:${RCAPROOF_AWS_PORT:-4566}:4566"
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: dynamic
    volumes:
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name payment-orders && awslocal dynamodb describe-table --table-name payments && awslocal dynamodb describe-table --table-name orders"]
      interval: 10s
      timeout: 20s
      retries: 30
  external-payment-mock:
    build:
      context: .
      args:
        SERVICE: external-payment-mock
    ports:
      - "127.0.0.1:${RCAPROOF_PROVIDER_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082"]
      interval: 5s
      timeout: 5s
      retries: 30
  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    ports:
      - "127.0.0.1:${RCAPROOF_ORDER_PORT:-8081}:8081"
    environment:
      LAB_AWS_ENDPOINT: http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy
  payment-worker:
    build:
      context: .
      args:
        SERVICE: payment-worker
    environment:
      LAB_AWS_ENDPOINT: http://localstack:4566
      LAB_PROVIDER_URL: http://external-payment-mock:8082
      LAB_PROVIDER_IDEMPOTENCY: "${LAB_PROVIDER_IDEMPOTENCY:-false}"
      LAB_CRASH_AFTER_CHARGE: "${LAB_CRASH_AFTER_CHARGE:-false}"
    restart: "no"
    depends_on:
      localstack:
        condition: service_healthy
      external-payment-mock:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports: ["127.0.0.1:${RCAPROOF_PROMETHEUS_PORT:-9091}:9090"]
    volumes:
      - ./dashboards/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [rcaproof-api]
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    ports: ["127.0.0.1:${RCAPROOF_GRAFANA_PORT:-3001}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./dashboards/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/rcaproof.json:/var/lib/grafana/dashboards/rcaproof.json:ro
    depends_on: [prometheus]
  release-check:
    image: localstack/localstack:4.7.0
    profiles: [tools]
    entrypoint: ["python3", "-B", "/workspace/scripts/release-check.py"]
    environment:
      RCAPROOF_CHECK_API: http://rcaproof-api:8080
      RCAPROOF_CHECK_PROMETHEUS: http://prometheus:9090
      RCAPROOF_CHECK_GRAFANA: http://grafana:3000
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./artifacts:/workspace/artifacts
    depends_on: [rcaproof-api, prometheus, grafana]
volumes:
  incident-data:
